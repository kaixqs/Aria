<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ♡</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/playfair-display@latest/latin-400-normal.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-300-normal.min.css" rel="stylesheet">
    <style>
        :root {
            --red: #e63946;
            --dark-red: #9b1d20;
            --black: #0a0a0a;
            --dark: #111111;
            --darker: #0d0d0d;
            --light: #f1f1f1;
            --gray: #888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--red) var(--black);
        }

        *::-webkit-scrollbar { width: 6px; }
        *::-webkit-scrollbar-track { background: var(--black); }
        *::-webkit-scrollbar-thumb { background: var(--red); border-radius: 3px; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--black);
            color: var(--light);
            overflow-x: hidden;
        }

        .font-playfair { font-family: 'Playfair Display', serif; }

        /* Floating Hearts */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 7rem);
            line-height: 1.1;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards;
            animation-delay: 0.3s;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards;
            animation-delay: 0.8s;
            letter-spacing: 0.3em;
        }

        .hero-line {
            width: 80px;
            height: 2px;
            background: var(--red);
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards;
            animation-delay: 1.2s;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            opacity: 0;
            animation: fadeInUp 1.5s ease forwards, bounce 2s ease-in-out infinite;
            animation-delay: 1.8s, 2.5s;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(10px); }
        }

        /* Section Reveal */
        .reveal {
            opacity: 0;
            transform: translateY(60px);
            transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Vinyl Section */
        .vinyl-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 80px 20px;
        }

        .vinyl-container {
            position: relative;
            width: 340px;
            height: 340px;
        }

        .vinyl-record {
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle at center,
                #1a1a1a 0%,
                #1a1a1a 15%,
                #111 15.5%,
                #1a1a1a 16%,
                #222 20%,
                #1a1a1a 22%,
                #222 26%,
                #1a1a1a 28%,
                #222 32%,
                #1a1a1a 34%,
                #222 38%,
                #1a1a1a 40%,
                #222 44%,
                #1a1a1a 46%,
                #222 50%,
                #1a1a1a 52%,
                #222 56%,
                #1a1a1a 58%,
                #222 62%,
                #1a1a1a 64%,
                #222 68%,
                #1a1a1a 70%,
                #222 74%,
                #1a1a1a 76%,
                #222 80%,
                #1a1a1a 82%,
                #222 86%,
                #1a1a1a 88%,
                #222 92%,
                #1a1a1a 94%,
                #222 100%
            );
            box-shadow: 0 0 60px rgba(230, 57, 70, 0.15), 0 0 120px rgba(0,0,0,0.5);
            position: relative;
            transition: box-shadow 0.5s ease;
        }

        .vinyl-record.spinning {
            animation: spin 3s linear infinite;
            box-shadow: 0 0 60px rgba(230, 57, 70, 0.3), 0 0 120px rgba(230, 57, 70, 0.1);
        }

        .vinyl-record::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--red), var(--dark-red));
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl-record::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--black);
            z-index: 3;
        }

        .vinyl-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            width: 110px;
            pointer-events: none;
        }

        .vinyl-label span {
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.9);
            font-weight: 300;
        }

        .vinyl-label .label-title {
            font-size: 10px;
            font-weight: 400;
            display: block;
            margin-bottom: 2px;
            letter-spacing: 0.2em;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-tonearm {
            position: absolute;
            top: -20px;
            right: -60px;
            width: 180px;
            height: 8px;
            transform-origin: right center;
            transform: rotate(-30deg);
            transition: transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 5;
        }

        .vinyl-tonearm.playing {
            transform: rotate(-12deg);
        }

        .tonearm-bar {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #666, #999, #666);
            border-radius: 2px;
            position: relative;
        }

        .tonearm-bar::before {
            content: '';
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #444;
            border: 3px solid #666;
        }

        .tonearm-bar::after {
            content: '';
            position: absolute;
            left: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 6px;
            background: #888;
            border-radius: 0 2px 2px 0;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--red);
            color: var(--red);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn:hover {
            background: var(--red);
            color: white;
            box-shadow: 0 0 30px rgba(230, 57, 70, 0.4);
            transform: scale(1.1);
        }

        .song-info {
            text-align: left;
        }

        .song-title {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--light);
            letter-spacing: 0.05em;
        }

        .song-artist {
            font-size: 0.85rem;
            color: var(--gray);
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        .progress-container {
            width: 100%;
            max-width: 400px;
            margin-top: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--red);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--gray);
            letter-spacing: 0.05em;
        }

        /* Gallery Section */
        .gallery-section {
            padding: 100px 20px;
            position: relative;
            z-index: 1;
        }

        .gallery-title {
            font-size: clamp(2rem, 5vw, 3.5rem);
            text-align: center;
            margin-bottom: 60px;
        }

        .gallery-title span {
            background: linear-gradient(135deg, var(--red), #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 3/4;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            group: true;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
            filter: brightness(0.7);
        }

        .gallery-item .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(230, 57, 70, 0.4), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s ease;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .overlay-text {
            color: white;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transform: translateY(10px);
            transition: transform 0.5s ease;
        }

        .gallery-item:hover .overlay-text {
            transform: translateY(0);
        }

        .gallery-item .item-number {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: white;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover .item-number {
            opacity: 1;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(20px);
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .lightbox.active img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            background: var(--red);
            transform: rotate(90deg);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-nav:hover {
            background: var(--red);
        }

        .lightbox-prev { left: 30px; }
        .lightbox-next { right: 30px; }

        .lightbox-counter {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: var(--gray);
            letter-spacing: 0.2em;
        }

        /* Message Section */
        .message-section {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            position: relative;
            z-index: 1;
        }

        .message-card {
            max-width: 600px;
            text-align: center;
            padding: 60px 40px;
            border: 1px solid rgba(230, 57, 70, 0.2);
            border-radius: 20px;
            background: rgba(230, 57, 70, 0.03);
            backdrop-filter: blur(10px);
        }

        .message-card p {
            font-size: 1.1rem;
            line-height: 2;
            color: rgba(255,255,255,0.8);
            font-weight: 300;
        }

        .message-card .heart-icon {
            font-size: 2rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }

        footer p {
            font-size: 0.8rem;
            color: var(--gray);
            letter-spacing: 0.15em;
        }

        /* Glow effects */
        .glow-red {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-1 { top: -200px; right: -100px; }
        .glow-2 { bottom: -200px; left: -100px; }

        /* Responsive */
        @media (max-width: 768px) {
            .vinyl-container {
                width: 260px;
                height: 260px;
            }
            .vinyl-record {
                width: 260px;
                height: 260px;
            }
            .vinyl-record::before {
                width: 90px;
                height: 90px;
            }
            .vinyl-label { width: 80px; }
            .vinyl-label span { font-size: 7px; }
            .vinyl-label .label-title { font-size: 8px; }
            .vinyl-tonearm { display: none; }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .message-card { padding: 40px 25px; }
            .player-controls { flex-direction: column; align-items: center; }
            .song-info { text-align: center; }
        }

        /* Cursor glow */
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.06), transparent 70%);
            pointer-events: none;
            z-index: 0;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        /* Loading animation */
        .page-loader {
            position: fixed;
            inset: 0;
            background: var(--black);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-heart {
            font-size: 2rem;
            animation: heartbeat 1s ease-in-out infinite;
        }
    </style>
</head>
<body>

    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-heart">♡</div>
    </div>

    <!-- Cursor Glow -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- Background Glows -->
    <div class="glow-red glow-1"></div>
    <div class="glow-red glow-2"></div>

    <!-- Floating Hearts -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Hero Section -->
    <section class="hero">
        <p class="hero-subtitle text-gray-400 mb-4">a little something</p>
        <h1 class="hero-title font-playfair">
            For <span style="color: var(--red);">You</span> ♡
        </h1>
        <div class="hero-line mt-8"></div>
        <div class="scroll-indicator mt-16">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color: var(--gray);">
                <path d="M12 5v14M5 12l7 7 7-7"/>
            </svg>
        </div>
    </section>

    <!-- Vinyl / Music Section -->
    <section class="vinyl-section">
        <div class="reveal">
            <div class="flex flex-col items-center">
                <div class="vinyl-container">
                    <div class="vinyl-record" id="vinylRecord">
                        <div class="vinyl-label">
                            <span class="label-title"></span>
                            <span></span>
                        </div>
                    </div>
                    <div class="vinyl-tonearm" id="tonearm">
                        <div class="tonearm-bar"></div>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="play-btn" id="playBtn" aria-label="Play">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon">
                            <polygon points="5,3 19,12 5,21"/>
                        </svg>
                    </button>
                    <div class="song-info">
                        <div class="song-title">Only Exception</div>
                        <div class="song-artist">Paramore</div>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-time">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <div class="reveal">
            <h2 class="gallery-title font-playfair">
                 <span>Your Photos</span>
            </h2>
            <div class="gallery-grid" id="galleryGrid">
            </div>
        </div>
    </section>

    <!-- Message Section -->
    <section class="message-section">
        <div class="reveal">
            <div class="message-card">
                <div class="heart-icon">♡</div>
                <p class="font-playfair" style="font-size: 1.3rem; line-height: 2.2;">
                    Every moment with you<br>
                    feels like a beautiful song<br>
                    I never want to end.<br><br>
                    <span style="color: var(--red);">You make everything better.</span>
                </p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>I LIKE YOU</p>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <img src="" alt="" id="lightboxImg">
        <button class="lightbox-nav lightbox-next" id="lightboxNext">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <!-- Audio -->
    <audio id="audioPlayer" preload="auto">
        <source src="Only_Exception.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Page Loader
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('pageLoader').classList.add('hidden');
            }, 800);
        });

        // Cursor Glow
        const cursorGlow = document.getElementById('cursorGlow');
        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
        });

        // Floating Hearts
        const heartsContainer = document.getElementById('heartsContainer');
        const heartSymbols = ['♡', '♥', '❤', '💕'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 16 + 12) + 'px';
            heart.style.animationDuration = (Math.random() * 8 + 8) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            heart.style.color = Math.random() > 0.5 ? '#e63946' : '#ff6b6b';
            heartsContainer.appendChild(heart);

            setTimeout(() => heart.remove(), 18000);
        }

        setInterval(createHeart, 2000);
        for (let i = 0; i < 5; i++) setTimeout(createHeart, i * 400);

        // Scroll Reveal
        const revealElements = document.querySelectorAll('.reveal');
        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, { threshold: 0.15 });

        revealElements.forEach(el => revealObserver.observe(el));

        // Gallery
        const galleryGrid = document.getElementById('galleryGrid');
        const captions = [
            'First memory', 'That smile', 'Golden hour', 'Together',
            'Adventure', 'Lazy days', 'Night vibes', 'Pure joy',
            'My favorite', 'Always you', 'Us ♡'
        ];

        for (let i = 0; i <= 10; i++) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.setAttribute('data-index', i);
            item.innerHTML = `
                <img src="${i}.jpg" alt="Photo ${i}" loading="lazy">
                <div class="overlay">
                    <span class="overlay-text">${captions[i]}</span>
                </div>
                <div class="item-number">${i}</div>
            `;
            galleryGrid.appendChild(item);
        }

        // Lightbox
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCounter = document.getElementById('lightboxCounter');
        let currentImageIndex = 0;

        function openLightbox(index) {
            currentImageIndex = index;
            lightboxImg.src = `${index}.jpg`;
            lightboxCounter.textContent = `${index + 1} / 11`;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(dir) {
            currentImageIndex = (currentImageIndex + dir + 11) % 11;
            lightboxImg.style.opacity = '0';
            lightboxImg.style.transform = 'scale(0.95)';
            setTimeout(() => {
                lightboxImg.src = `${currentImageIndex}.jpg`;
                lightboxCounter.textContent = `${currentImageIndex + 1} / 11`;
                lightboxImg.style.opacity = '1';
                lightboxImg.style.transform = 'scale(1)';
            }, 200);
        }

        document.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', () => {
                openLightbox(parseInt(item.getAttribute('data-index')));
            });
        });

        document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
        document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Music Player
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const vinylRecord = document.getElementById('vinylRecord');
        const tonearm = document.getElementById('tonearm');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        let isPlaying = false;

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                vinylRecord.classList.remove('spinning');
                tonearm.classList.remove('playing');
                playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
            } else {
                audio.play().catch(() => {});
                vinylRecord.classList.add('spinning');
                tonearm.classList.add('playing');
                playIcon.innerHTML = '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>';
            }
            isPlaying = !isPlaying;
        }

        playBtn.addEventListener('click', togglePlay);

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = progress + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('ended', () => {
            isPlaying = false;
            vinylRecord.classList.remove('spinning');
            tonearm.classList.remove('playing');
            playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
            progressFill.style.width = '0%';
            currentTimeEl.textContent = '0:00';
        });

        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (audio.duration) {
                audio.currentTime = percent * audio.duration;
            }
        });

        // Smooth scroll
        document.querySelector('.scroll-indicator')?.addEventListener('click', () => {
            document.querySelector('.vinyl-section').scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
